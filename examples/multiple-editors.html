<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent wardrobe editors</title><meta name="robots" content="noindex,follow"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>html,body{margin:0;height:100%;font-family:system-ui}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 48px)}section{min-width:0;height:100%;border:1px solid #ccc;box-sizing:border-box}.editor{height:100%}button{padding:6px 10px}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}</style></head><body><header><strong>Independent editors</strong><button id="dispose-first">Dispose first editor</button><button id="mount-first">Mount first editor</button><output id="mount-status" aria-live="polite">Both editors mounted</output></header><main><section aria-label="First editor"><div class="editor" id="first"></div></section><section aria-label="Second editor"><div class="editor" id="second"></div></section></main><script type="module" src="./multiple-editors.ts"></script></body></html>
